general {
    grace = 0
    ignore_empty_input = true
}

# --- FONDO NEGRO SÓLIDO ---
background {
    monitor = 
    color = rgba(0, 0, 0, 1)
    blur_passes = 0
}

# --- HORA (Formato 24h, Grande, Centrado) ---
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 80
    font_family = JetBrains Mono Bold
    position = 0, -20
    halign = center
    valign = center
}

# --- FECHA (Debajo de la hora) ---
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 60
    halign = center
    valign = center
}

# --- CAMPO DE CONTRASEÑA (Minimalista/Invisible) ---
# Se activa al escribir, sin bordes visibles inicialmente
input-field {
    monitor = 
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    position = 0, 150
    halign = center
    valign = center
}   
