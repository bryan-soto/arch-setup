# --- Colores
include colors.conf

# --- Fuente
font_family Rubik
font_size 12

# --- Sonidos y Juntado de signos
disable_ligatures no
enable_audio_bell no

# --- Shell
#shell zsh

# --- Cursor
cursor_shape block
shell_integration disable no-cursor
#cursor_beam_thickness 7
cursor_blink_intercal 0
cursor_trail 3

# --- Urls
url_style curly
detect_urls yes

# --- Render de la terminal
remember_window_size no
# initial_window_width 640
# initial_window_height 400
initial_window_width 78c
initial_window_height 23c
window_padding_width 5

# --- Blur
background_opacity 0.80
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

# --- Confirmacion al cerrar
confirm_os_window_close 0

# --- Performance settings
sync_to_monitor yes

# --- Perf
repaint_delay 10
input_delay 3

# --- Comandos

# --- Nueva pestaña y ventana en el directorio actual
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# --- Movimientos
map alt+shift+h neighboring_window left
map alt+shift+l neighboring_window right
map alt+shift+k neighboring_window up
map alt+shift+j neighboring_window down

# --- Copeos Extras
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# --- Nuevas Pestañas
tab_bar_style powerline

inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foregound #000000
tab_bar_marging_color black

# --- Zoom
map ctrl+shift+z toggle_layout stack
